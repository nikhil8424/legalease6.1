<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legalese - Contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --gradient-primary: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
            --gradient-secondary: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        .navbar {
            background: var(--gradient-primary) !important;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
            padding: 1rem 0;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            letter-spacing: 0.5px;
        }

        .nav-link {
            font-weight: 500;
            padding: 0.5rem 1rem !important;
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .nav-link:hover {
            background: rgba(255,255,255,0.1);
        }

        .hero-section {
            background: var(--gradient-primary);
            color: white;
            padding: 8rem 0;
            margin-bottom: 4rem;
            position: relative;
            overflow: hidden;
        }

        .hero-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect fill="white" fill-opacity="0.1" width="100" height="100"/></svg>');
            opacity: 0.1;
        }

        .hero-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 100px;
            background: linear-gradient(to bottom right, transparent 49%, #f8f9fa 50%);
        }

        .contact-card {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            margin-bottom: 30px;
            height: 100%;
            border: none;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            background: white;
            overflow: hidden;
            position: relative;
        }

        .contact-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: var(--gradient-secondary);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .contact-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .contact-card:hover::before {
            opacity: 1;
        }

        .contact-icon {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: var(--gradient-secondary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: all 0.3s ease;
        }

        .contact-card:hover .contact-icon {
            transform: scale(1.1) rotate(5deg);
        }

        .card-title {
            color: var(--primary-color);
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 0.5px;
        }

        .card-text {
            color: #666;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .section-title {
            color: var(--primary-color);
            font-weight: 800;
            margin-bottom: 4rem;
            position: relative;
            display: inline-block;
            font-size: 2.5rem;
            letter-spacing: 1px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: var(--gradient-secondary);
            border-radius: 2px;
        }

        .contact-card .card-body {
            padding: 2.5rem;
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .hero-subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-balance-scale me-2"></i>Legalese
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/features">Features</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="hero-title animate__animated animate__fadeInDown">Get in Touch</h1>
            <p class="hero-subtitle animate__animated animate__fadeInUp">Connect with us for any queries or support</p>
        </div>
    </section>

    <!-- Contact Cards Section -->
    <section class="container py-5">
        <div class="row">
            <div class="col-md-6 mb-4">
                <div class="contact-card animate-on-scroll">
                    <div class="card-body text-center">
                        <div class="contact-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <h3 class="card-title">Phone</h3>
                        <p class="card-text">9167534578</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="contact-card animate-on-scroll">
                    <div class="card-body text-center">
                        <div class="contact-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <h3 class="card-title">Email</h3>
                        <p class="card-text">
                            <a href="mailto:guptanikhil8424@gmail.com" class="text-decoration-none">guptanikhil8424@gmail.com</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="contact-card animate-on-scroll">
                    <div class="card-body text-center">
                        <div class="contact-icon">
                            <i class="fab fa-linkedin"></i>
                        </div>
                        <h3 class="card-title">LinkedIn</h3>
                        <p class="card-text">
                            <a href="https://linkedin.com/in/nikhil-gupta-6b7705288" target="_blank" class="text-decoration-none">linkedin.com/in/nikhil-gupta-6b7705288</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <div class="contact-card animate-on-scroll">
                    <div class="card-body text-center">
                        <div class="contact-icon">
                            <i class="fab fa-github"></i>
                        </div>
                        <h3 class="card-title">GitHub</h3>
                        <p class="card-text">
                            <a href="https://github.com/nikhil8424" target="_blank" class="text-decoration-none">github.com/nikhil8424</a>
                        </p>
                    </div>
                </div>
            </div>
            <div class="col-12 mb-4">
                <div class="contact-card animate-on-scroll">
                    <div class="card-body text-center">
                        <div class="contact-icon">
                            <i class="fas fa-globe"></i>
                        </div>
                        <h3 class="card-title">Portfolio Website</h3>
                        <p class="card-text">
                            <a href="https://nikhil-gupta-portfolio-2025.vercel.app" target="_blank" class="text-decoration-none">nikhil-gupta-portfolio-2025.vercel.app</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Animation on scroll
        document.addEventListener('DOMContentLoaded', function() {
            const elements = document.querySelectorAll('.animate-on-scroll');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, {
                threshold: 0.1
            });

            elements.forEach(element => {
                observer.observe(element);
            });
        });
    </script>
</body>
</html>
